<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7ef">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="タップすると音と動きが返ってくる、ちいさな子どものための遊び場。">
  <title>るなちのあそびば</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="るなちのあそびば">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23f9dccb'/%3E%3Ccircle cx='32' cy='34' r='19' fill='%23b58261'/%3E%3Ccircle cx='17' cy='20' r='9' fill='%23b58261'/%3E%3Ccircle cx='47' cy='20' r='9' fill='%23b58261'/%3E%3Ccircle cx='25' cy='31' r='2' fill='%23403935'/%3E%3Ccircle cx='39' cy='31' r='2' fill='%23403935'/%3E%3Cellipse cx='32' cy='40' rx='5' ry='4' fill='%23403935'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="games.css">
  <script src="vehicles.js" defer></script>
  <script src="instruments.js" defer></script>
  <script src="app.js" defer></script>
  <script src="games.js" defer></script>
  <script src="variety.js" defer></script>
  <script src="new-games.js" defer></script>
  <script src="music.js" defer></script>
  <script src="shuffle.js" defer></script>
  <script src="home-time.js" defer></script>
  <link rel="stylesheet" href="variety.css">
</head>
<body>
  <main class="app">
    <section id="home" class="screen home" aria-labelledby="home-title">
      <header class="home-header">
        <button id="refresh-button" class="circle-button" aria-label="アプリを更新する" title="アプリを更新する"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="#91b5a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M25 12a10 10 0 1 0 1 9M25 5v8h-8"/><path d="m9 15 1-2m10 2 1-2M13 21q3 3 6 0" stroke="#8d7868" stroke-width="1.8"/></svg></button>
        <button id="home-music" class="circle-button home-music" aria-label="BGMを再生する" aria-pressed="false"></button>
        <button id="settings-button" class="circle-button" aria-label="保護者向け設定を開く" title="音量設定"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5c5-7 12-1 8 5 8 0 9 10 2 12 2 8-8 12-12 5-6 5-14-3-8-9-7-4-2-13 5-10 0-5 3-6 5-3Z" fill="#e9b7c7"/><circle cx="16" cy="17" r="7" fill="#fff2ce"/><circle cx="14" cy="16" r="1" fill="#896b60"/><circle cx="19" cy="16" r="1" fill="#896b60"/><path d="M14 20q3 3 5 0" fill="none" stroke="#896b60" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </header>
      <p id="refresh-status" class="refresh-status" role="status" hidden></p>
      <div class="welcome"><h1 id="home-title">るなちのあそびば</h1></div>
      <div id="home-pages" class="home-pages" aria-label="遊びを選ぶ"></div>
      <div id="page-dots" class="page-dots" aria-label="ホームのページ"></div>
      <nav class="home-navigation" aria-label="遊びのページ"><button id="previous-page" class="circle-button" aria-label="前のページ">‹</button><span id="home-page-number" aria-live="polite">1 / 2</span><button id="next-page" class="circle-button" aria-label="次のページ">›</button></nav>
      <div class="shuffle-row"><button id="shuffle-button" class="app-tile" style="--tile:#e0e8f5" aria-label="シャッフルで遊ぶ"><span class="tile-art"><svg class="shuffle-art" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 28C46 28 48 72 78 72M18 72C46 72 48 28 78 28" fill="none" stroke="#ad91cb" stroke-width="11" stroke-linecap="round"/><path d="m67 16 15 12-15 12M67 60l15 12-15 12" fill="none" stroke="#ad91cb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="m22 9 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z" fill="#edbd5b"/><circle cx="26" cy="72" r="14" fill="#f9cbcf"/><circle cx="22" cy="70" r="1.5" fill="#80635c"/><circle cx="30" cy="70" r="1.5" fill="#80635c"/><path d="M22 76q4 4 8 0" fill="none" stroke="#80635c" stroke-width="2" stroke-linecap="round"/></svg></span></button></div>
    </section>
    <section id="toy-game" class="screen play-screen" aria-labelledby="toy-title" hidden>
      <header class="game-header"><button id="toy-home" class="circle-button" aria-label="ホームに戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></button><div><p class="eyebrow">るなちのあそびば</p><h1 id="toy-title"></h1></div><button id="toy-mute" class="circle-button" aria-label="音をオフにする" aria-pressed="false"></button></header>
      <p id="toy-hint" class="game-hint"></p>
      <div id="toy-stage" class="toy-stage"></div>
      <footer id="toy-footer" class="game-footer"></footer>
      <p id="toy-status" class="sound-status" role="status"></p>
    </section>
    <section id="animals" class="screen animal-screen" aria-labelledby="animal-title" hidden>
      <header class="game-header"><button id="back-home" class="circle-button" aria-label="ホームに戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg></button><div><p class="eyebrow">るなちのあそびば</p><h1 id="animal-title">どうぶつのおしゃべり</h1></div><button id="mute-button" class="circle-button" aria-label="音をオフにする" aria-pressed="false"></button></header>
      <p class="game-hint">だれと おしゃべり しよう？</p>
      <div id="animal-meadow" class="animal-meadow" aria-label="草原のどうぶつたち"></div>
      <footer class="game-footer"><span aria-hidden="true">✿</span> どうぶつを さわってみてね <span aria-hidden="true">✿</span></footer>
      <p id="sound-status" class="sound-status" role="status"></p>
    </section>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog"><div class="dialog-heading"><h2 id="settings-title">保護者向け設定</h2><button class="circle-button" aria-label="設定を閉じる">×</button></div></form>
    <p>お子さまに合わせて、音を調整できます。</p>
    <label class="setting-row" for="sound-enabled">すべての音を出す<input id="sound-enabled" type="checkbox" checked></label>
    <label class="volume-label" for="volume">効果音の音量 <output id="volume-value">60%</output></label><input id="volume" type="range" min="0" max="100" value="60">
    <label class="setting-row" for="music-enabled">BGMを流す<input id="music-enabled" type="checkbox" checked></label>
    <label class="volume-label" for="music-volume">BGMの音量 <output id="music-volume-value">35%</output></label><input id="music-volume" type="range" min="0" max="100" value="35">
    <label class="volume-label" for="shuffle-seconds">シャッフルの切り替え時間 <output id="shuffle-seconds-value">60秒</output></label><input id="shuffle-seconds" type="range" min="10" max="300" step="10" value="60">
    <p class="settings-note">10秒〜５分で選べます。ホームに戻るとシャッフルは止まります。</p>
    <p id="settings-save-status" class="settings-note" role="status"></p>
    <p class="settings-note">効果音とBGMは別々に調整できます。<br>次に開くときも、同じ端末・ブラウザの設定を使います。</p>
    <p class="settings-note">BGMは画面ごとに変わります。<br>トップ画面では、最初に画面をタップすると音楽が始まります。</p>
    <p class="settings-note">実際の動物の鳴き声を使っています。<br>端末の音量もあわせて調整してください。</p>
    <p class="settings-note"><a href="credits.html" target="_blank" rel="noopener">音声素材について</a></p>
    <form method="dialog"><button class="done-button">できた</button></form>
  </dialog>
</body>
</html>
